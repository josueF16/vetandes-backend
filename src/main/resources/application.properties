spring.application.name=vetandes-backend

  # Puerto web de VetAndes
server.port=8082

  # Conexion al esquema exclusivo de VetAndes
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=VETANDES
spring.datasource.password=${VETANDES_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

  # Hibernate verifica las tablas; Flyway las crea
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

  # Migraciones de base de datos
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=VETANDES
spring.flyway.schemas=VETANDES
spring.flyway.create-schemas=false
spring.flyway.clean-disabled=true

  # Documentacion del API
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

  # Registro de eventos de la aplicacion
logging.level.pe.edu.upeu.vetandes=INFO